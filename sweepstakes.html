<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>First Dance Sweepstakes | Ryan & Erica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'serif': ['"Playfair Display"', 'serif'],
                        'sans': ['Lato', 'sans-serif'],
                    },
                    colors: {
                        'fall-cream': '#FCF9F5',
                        'terracotta': '#E2725B',
                        'terracotta-dark': '#C85A46',
                        'fall-charcoal': '#43342E',
                        'fall-sand': '#EEDFCE',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #F8F5F0;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='#ebd9c8' fill-opacity='0.4'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            touch-action: manipulation;
        }

        .song-card {
            transition: all 0.2s ease-in-out;
            user-select: none;
            -webkit-user-select: none;
        }

        .song-card:active {
            transform: scale(0.97);
        }

        .progress-bar {
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #toast {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-20px);
        }
        #toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="min-h-screen font-sans text-fall-charcoal flex flex-col items-center p-4">

    <!-- Navigation -->
    <nav class="w-full max-w-5xl mx-auto flex justify-between items-center mb-6">
        <a href="index.html" class="text-terracotta hover:text-terracotta-dark flex items-center gap-2 font-bold uppercase tracking-wider text-xs sm:text-sm transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            Back to Hub
        </a>
        <div class="flex items-center gap-2">
            <span class="relative flex h-3 w-3">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-terracotta opacity-75"></span>
              <span class="relative inline-flex rounded-full h-3 w-3 bg-terracotta"></span>
            </span>
            <span class="text-xs font-bold uppercase tracking-widest text-gray-500" id="connection-status">Live Poll</span>
        </div>
    </nav>

    <!-- Header -->
    <header class="text-center w-full max-w-2xl mx-auto mb-6">
        <h1 class="text-4xl sm:text-5xl font-serif text-fall-charcoal mb-2 font-semibold">First Dance</h1>
        <p id="subtitle" class="text-gray-600 font-sans">Cast your vote. What will Ryan & Erica's first song be?</p>
        <div class="h-[1px] w-16 bg-terracotta mx-auto mt-4"></div>
    </header>

    <!-- Toast Notification -->
    <div class="fixed top-20 left-1/2 transform -translate-x-1/2 z-50">
        <div id="toast" class="bg-fall-charcoal text-white px-6 py-3 rounded-full font-bold text-sm tracking-wide shadow-xl flex items-center gap-2">
            <svg class="w-5 h-5 text-terracotta" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            <span id="toastMessage">Vote submitted successfully!</span>
        </div>
    </div>

    <main class="w-full max-w-5xl mx-auto flex flex-col items-center pb-12">
        
        <!-- View 1: Voting Grid -->
        <div id="voting-view" class="w-full animate-fade-in">
            <div id="song-grid" class="w-full grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3 md:gap-4 mb-8">
                <!-- Song cards injected by JS -->
            </div>

            <div class="flex justify-center mt-8 sticky bottom-6 z-40">
                <button id="submitBtn" class="px-10 py-4 rounded-full bg-terracotta text-white font-bold uppercase tracking-wider text-sm hover:bg-terracotta-dark transition-colors border border-terracotta disabled:opacity-50 disabled:cursor-not-allowed shadow-lg hover:shadow-xl transform hover:-translate-y-1 disabled:hover:translate-y-0 disabled:hover:shadow-lg w-full sm:w-auto" disabled>
                    Submit My Guess
                </button>
            </div>
        </div>

        <!-- View 2: Live Leaderboard -->
        <div id="leaderboard-view" class="w-full max-w-3xl hidden">
            <div class="bg-white rounded-3xl p-6 sm:p-8 border border-fall-sand shadow-sm">
                <div class="flex justify-between items-end mb-6">
                    <h2 class="text-2xl font-serif font-bold text-fall-charcoal">Live Results</h2>
                    <span class="text-sm font-bold uppercase tracking-widest text-terracotta" id="total-votes">0 Votes Cast</span>
                </div>
                
                <div id="leaderboard-list" class="space-y-4">
                    <!-- Leaderboard rows injected by JS -->
                </div>
            </div>
            
            <div class="text-center mt-8">
                <p class="text-sm text-gray-500 italic">The true answer will be revealed on the dance floor!</p>
            </div>
        </div>

    </main>

    <script>
        // 25 Songs with realistic baseline votes
        const songs = [
            { id: 1, title: "Lover", artist: "Taylor Swift", baseVotes: 42 },
            { id: 2, title: "Us", artist: "James Bay", baseVotes: 28 },
            { id: 3, title: "Beyond", artist: "Leon Bridges", baseVotes: 35 },
            { id: 4, title: "Perfect", artist: "Ed Sheeran", baseVotes: 31 },
            { id: 5, title: "You Are In Love", artist: "Taylor Swift", baseVotes: 24 },
            { id: 6, title: "Can't Help Falling in Love", artist: "Elvis Presley", baseVotes: 20 },
            { id: 7, title: "Wild Love", artist: "James Bay", baseVotes: 18 },
            { id: 8, title: "Make You Feel My Love", artist: "Adele", baseVotes: 22 },
            { id: 9, title: "All of Me", artist: "John Legend", baseVotes: 27 },
            { id: 10, title: "A Thousand Years", artist: "Christina Perri", baseVotes: 19 },
            { id: 11, title: "Invisible String", artist: "Taylor Swift", baseVotes: 15 },
            { id: 12, title: "Stand By Me", artist: "Ben E. King", baseVotes: 14 },
            { id: 13, title: "Better Together", artist: "Jack Johnson", baseVotes: 33 },
            { id: 14, title: "Your Song", artist: "Elton John", baseVotes: 16 },
            { id: 15, title: "Just the Way You Are", artist: "Bruno Mars", baseVotes: 12 },
            { id: 16, title: "Speechless", artist: "Dan + Shay", baseVotes: 21 },
            { id: 17, title: "Looking Out for You", artist: "Two Friends", baseVotes: 11 },
            { id: 18, title: "First Day of My Life", artist: "Bright Eyes", baseVotes: 9 },
            { id: 19, title: "In My Life", artist: "The Beatles", baseVotes: 26 },
            { id: 20, title: "Fly Me to the Moon", artist: "Frank Sinatra", baseVotes: 17 },
            { id: 21, title: "At Last", artist: "Etta James", baseVotes: 23 },
            { id: 22, title: "Let's Stay Together", artist: "Al Green", baseVotes: 13 },
            { id: 23, title: "Yellow", artist: "Coldplay", baseVotes: 10 },
            { id: 24, title: "L-O-V-E", artist: "Nat King Cole", baseVotes: 8 },
            { id: 25, title: "Thinking Out Loud", artist: "Ed Sheeran", baseVotes: 29 }
        ];

        // ==========================================
        // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE
        // ==========================================
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwXRyQl0t0dBYqknA7IuyzmrV9uJzOfxgRatASyE1B-saHyM6BkUPjK-6Gdf8LJyVOLVg/exec";
        // ==========================================

        let selectedSongId = null;
        let hasVoted = false;
        let remoteVotes = {}; // Stores live vote counts fetched from Google Sheets

        const gridEl = document.getElementById('song-grid');
        const submitBtn = document.getElementById('submitBtn');
        const votingView = document.getElementById('voting-view');
        const leaderboardView = document.getElementById('leaderboard-view');
        const leaderboardList = document.getElementById('leaderboard-list');
        const subtitle = document.getElementById('subtitle');
        const toast = document.getElementById('toast');
        const totalVotesEl = document.getElementById('total-votes');
        const connectionStatus = document.getElementById('connection-status');

        async function init() {
            const savedPick = localStorage.getItem('ryan_erica_first_dance_pick');
            if (savedPick) {
                hasVoted = true;
                selectedSongId = parseInt(savedPick);
                votingView.classList.add('hidden');
                leaderboardView.classList.remove('hidden');
                subtitle.textContent = "The current standings for our first dance.";
            }

            // Fetch live votes from Google Sheet
            await fetchVotesFromSheet();

            if (hasVoted) {
                renderLeaderboard();
            } else {
                renderGrid();
            }
        }

        async function fetchVotesFromSheet() {
            if (GOOGLE_SCRIPT_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) {
                connectionStatus.textContent = "Demo Mode";
                return;
            }

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL);
                const data = await response.json();
                if (data && data.votes) {
                    remoteVotes = data.votes; // Expected format: { "1": 5, "2": 3, ... }
                }
                connectionStatus.textContent = "Live Poll";
            } catch (err) {
                console.error("Error fetching sheet data:", err);
                connectionStatus.textContent = "Offline Mode";
            }
        }

        function getComputedSongs() {
            return songs.map(song => {
                const sheetExtraVotes = remoteVotes[song.id] || 0;
                // If user just voted on this device and it's not yet synced/fetched, add +1 locally
                let localExtra = 0;
                if (hasVoted && song.id === selectedSongId && !remoteVotes[song.id]) {
                    localExtra = 1;
                }
                return {
                    ...song,
                    totalVotes: song.baseVotes + sheetExtraVotes + localExtra
                };
            });
        }

        function renderGrid() {
            gridEl.innerHTML = '';
            
            songs.forEach(song => {
                const card = document.createElement('div');
                const isSelected = selectedSongId === song.id;
                
                let classes = 'song-card rounded-2xl border flex flex-col items-center justify-center text-center p-3 sm:p-4 h-24 sm:h-28 md:h-32 cursor-pointer shadow-sm relative overflow-hidden group ';
                
                if (isSelected) {
                    classes += 'bg-fall-charcoal text-white border-fall-charcoal ring-2 ring-terracotta ring-offset-2 ring-offset-[#F8F5F0]';
                } else {
                    classes += 'bg-white text-fall-charcoal border-fall-sand hover:border-terracotta hover:bg-fall-cream';
                }

                card.className = classes;
                
                card.innerHTML = `
                    ${isSelected ? '<div class="absolute top-2 right-2"><svg class="w-4 h-4 text-terracotta" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path></svg></div>' : ''}
                    <div class="font-bold text-sm sm:text-base leading-tight mb-1 font-serif px-1 line-clamp-2 ${isSelected ? 'text-white' : 'text-fall-charcoal'}">${song.title}</div>
                    <div class="text-[10px] sm:text-xs uppercase tracking-wider ${isSelected ? 'text-gray-300' : 'text-gray-500'}">${song.artist}</div>
                `;

                card.addEventListener('click', () => {
                    if(!hasVoted) {
                        selectedSongId = song.id;
                        submitBtn.disabled = false;
                        submitBtn.textContent = `Vote for "${song.title}"`;
                        renderGrid();
                    }
                });
                
                gridEl.appendChild(card);
            });
        }

        function showToast() {
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        submitBtn.addEventListener('click', async () => {
            if (!selectedSongId || hasVoted) return;

            hasVoted = true;
            localStorage.setItem('ryan_erica_first_dance_pick', selectedSongId.toString());
            showToast();

            votingView.classList.add('hidden');
            leaderboardView.classList.remove('hidden');
            subtitle.textContent = "The current standings for our first dance.";
            
            renderLeaderboard();

            // Send vote to Google Sheet via Apps Script
            if (!GOOGLE_SCRIPT_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) {
                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors', // Standard bypass for Google Apps Script CORS restrictions
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ songId: selectedSongId })
                    });
                } catch (err) {
                    console.error("Failed to send vote to sheet:", err);
                }
            }
        });

        function renderLeaderboard() {
            leaderboardList.innerHTML = '';
            
            const computedSongs = getComputedSongs();
            const sortedSongs = computedSongs.sort((a, b) => b.totalVotes - a.totalVotes);
            const maxVotes = sortedSongs[0].totalVotes;
            const totalVotes = sortedSongs.reduce((acc, curr) => acc + curr.totalVotes, 0);
            
            totalVotesEl.textContent = `${totalVotes} Votes Cast`;

            sortedSongs.forEach((song, index) => {
                const percentage = Math.max((song.totalVotes / maxVotes) * 100, 5); 
                const isUserPick = song.id === selectedSongId;
                
                const row = document.createElement('div');
                row.className = `relative flex items-center p-3 sm:p-4 rounded-xl border ${isUserPick ? 'border-terracotta bg-fall-cream' : 'border-fall-sand bg-white'} overflow-hidden`;
                
                row.innerHTML = `
                    <div class="absolute left-0 top-0 bottom-0 bg-terracotta opacity-10 progress-bar" style="width: 0%">` + `</div>
                    
                    <div class="relative z-10 flex items-center w-full gap-4">
                        <div class="flex-shrink-0 w-6 text-center font-bold text-gray-400">
                            ${index + 1}
                        </div>
                        <div class="flex-grow min-w-0">
                            <div class="flex items-center gap-2">
                                <h3 class="font-bold text-sm sm:text-base text-fall-charcoal truncate">${song.title}</h3>
                                ${isUserPick ? '<span class="px-2 py-0.5 rounded text-[10px] uppercase tracking-widest bg-terracotta text-white font-bold flex-shrink-0 shadow-sm">Your Pick</span>' : ''}
                            </div>
                            <p class="text-xs text-gray-500 uppercase tracking-wider truncate">${song.artist}</p>
                        </div>
                        <div class="flex-shrink-0 text-right">
                            <div class="font-bold text-lg text-fall-charcoal">${song.totalVotes}</div>
                            <div class="text-[10px] uppercase tracking-widest text-gray-400">Votes</div>
                        </div>
                    </div>
                `;
                
                leaderboardList.appendChild(row);

                setTimeout(() => {
                    row.querySelector('.progress-bar').style.width = `${percentage}%`;
                }, 50);
            });
        }

        init();
    </script>
</body>
