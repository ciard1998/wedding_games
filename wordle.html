<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle | Ryan & Erica</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .wordle-grid { display: grid; grid-template-rows: repeat(6, 1fr); gap: 8px; width: fit-content; margin: 2rem auto; }
        .wordle-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .wordle-cell { width: 60px; height: 60px; border: 2px solid var(--border-color); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 700; text-transform: uppercase; background: white; color: var(--text-dark); }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="nav-back">Back to Hub</a>
        <div class="game-header">
            <h1>Wordle</h1>
            <p>Good vibes and energy themes!</p>
        </div>
        <div class="wordle-grid" id="grid"></div>
        <p style="text-align:center; margin-top:2rem; color:var(--text-light); text-transform: uppercase; letter-spacing: 1px; font-size: 0.8rem;">(Keyboard and core Wordle guess logic goes here)</p>
    </div>
    <script>
        const grid = document.getElementById('grid');
        for(let i=0; i<6; i++) {
            const row = document.createElement('div');
            row.className = 'wordle-row';
            for(let j=0; j<5; j++) {
                const cell = document.createElement('div');
                cell.className = 'wordle-cell';
                row.appendChild(cell);
            }
            grid.appendChild(row);
        }
    </script>
</body>
</html>
