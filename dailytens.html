<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Tens | Ryan & Erica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'serif': ['"Playfair Display"', 'serif'],
                        'sans': ['Lato', 'sans-serif'],
                    },
                    colors: {
                        'fall-cream': '#FCF9F5',
                        'terracotta': '#E2725B',
                        'terracotta-dark': '#C85A46',
                        'fall-charcoal': '#43342E',
                        'fall-sand': '#EEDFCE',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #F8F5F0;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='#ebd9c8' fill-opacity='0.4'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4H6zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
        .slot-item {
            transition: all 0.2s ease-in-out;
        }
        @keyframes successPop {
            0% { transform: scale(1); }
            40% { transform: scale(1.05); background-color: #f7e6e1; border-color: #E2725B; }
            100% { transform: scale(1); }
        }
        .animate-success {
            animation: successPop 0.5s ease-in-out;
        }
        #toast {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-20px);
        }
        #toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="min-h-screen font-sans text-fall-charcoal flex flex-col items-center p-4">

    <!-- Navigation -->
    <nav class="w-full max-w-5xl mx-auto flex justify-between items-center mb-4">
        <a href="index.html" class="text-terracotta hover:text-terracotta-dark flex items-center gap-2 font-bold uppercase tracking-wider text-xs sm:text-sm transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            Back to Hub
        </a>
        <div class="flex items-center gap-2">
            <span class="text-xs font-bold uppercase tracking-widest text-gray-500">Daily Tens</span>
        </div>
    </nav>

    <!-- Header -->
    <header class="text-center w-full max-w-2xl mx-auto mb-4">
        <h1 class="text-3xl sm:text-4xl font-serif text-fall-charcoal mb-1 font-semibold">Daily Tens</h1>
        <p class="text-gray-600 font-sans text-sm italic" id="category-title">Top 10 Halloween Candies (DoorDash Orders Oct 2025)</p>
        <div class="h-[1px] w-12 bg-terracotta mx-auto mt-2"></div>
    </header>

    <!-- Toast Notification -->
    <div class="fixed top-20 left-1/2 transform -translate-x-1/2 z-50">
        <div id="toast" class="bg-fall-charcoal text-white px-6 py-3 rounded-full font-bold text-sm tracking-wide shadow-xl flex items-center gap-2">
            <span id="toastMessage">Correct!</span>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="gameOverModal" class="fixed inset-0 bg-fall-charcoal/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl border border-fall-sand">
            <div class="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">💔</div>
            <h2 class="text-2xl font-serif font-bold text-fall-charcoal mb-2">Out of Lives!</h2>
            <p class="text-gray-600 text-sm mb-6">You made 5 incorrect guesses. Want to try again?</p>
            <button id="tryAgainBtn" class="w-full py-3.5 rounded-full bg-terracotta text-white font-bold uppercase tracking-wider text-xs hover:bg-terracotta-dark transition-colors shadow-md">
                Try Again
            </button>
        </div>
    </div>

    <main class="w-full max-w-4xl mx-auto flex flex-col items-center pb-12">
        
        <!-- Score & Lives Bar -->
        <div class="w-full max-w-xl flex justify-between items-center mb-4 px-2">
            <span class="text-xs uppercase tracking-widest font-bold text-gray-500">Found: <span id="found-count" class="text-terracotta font-extrabold text-sm">0</span> / 10</span>
            <div class="flex items-center gap-1.5" id="lives-container" title="Lives Remaining">
                <!-- Hearts injected by JS -->
            </div>
            <button id="wordBankToggle" class="text-xs uppercase tracking-widest font-bold text-terracotta hover:underline">
                📁 Toggle Word Bank
            </button>
        </div>

        <!-- Word Bank Drawer (Hidden by default) -->
        <div id="wordBankDrawer" class="w-full max-w-xl bg-white rounded-2xl p-4 mb-4 border border-fall-sand shadow-sm hidden">
            <div class="text-xs uppercase tracking-widest font-bold text-gray-400 mb-2 text-center">Word Bank (Click to Guess)</div>
            <div id="word-bank-list" class="flex flex-wrap justify-center gap-1.5 max-h-48 overflow-y-auto p-1">
                <!-- Word bank chips injected by JS -->
            </div>
        </div>

        <!-- Input Form with Autocomplete Dropdown -->
        <div class="w-full max-w-xl relative mb-6">
            <form id="guessForm" class="flex gap-2 relative">
                <div class="relative flex-1">
                    <input type="text" id="guessInput" placeholder="Type a candy name..." autocomplete="off" class="w-full px-4 py-3 rounded-xl border border-fall-sand focus:outline-none focus:border-terracotta text-fall-charcoal font-serif bg-white shadow-sm text-base">
                    <!-- Autocomplete Dropdown List -->
                    <div id="autocomplete-list" class="absolute left-0 right-0 top-full mt-1 bg-white border border-fall-sand rounded-xl shadow-lg z-50 hidden max-h-48 overflow-y-auto"></div>
                </div>
                <button type="submit" id="submitGuessBtn" class="px-6 py-3 rounded-xl bg-terracotta text-white font-bold uppercase tracking-wider text-xs hover:bg-terracotta-dark transition-colors shadow-md">
                    Guess
                </button>
            </form>
        </div>

        <!-- 2 Columns x 5 Slots Grid -->
        <div id="slots-container" class="w-full grid grid-cols-1 md:grid-cols-2 gap-3 mb-8">
            <!-- Slots 1-10 injected by JS -->
        </div>

        <!-- Controls / Reset -->
        <div class="flex gap-3 w-full max-w-md">
            <button id="revealBtn" class="flex-1 py-3 rounded-full border border-gray-300 text-gray-600 font-bold uppercase tracking-wider text-xs hover:bg-gray-50 transition-colors">
                Reveal Remaining
            </button>
            <button id="resetBtn" class="flex-1 py-3 rounded-full border border-terracotta text-terracotta font-bold uppercase tracking-wider text-xs hover:bg-fall-cream transition-colors">
                Play Again
            </button>
        </div>

    </main>

    <script>
                const PUZZLE = {
            category: "America's Favorite Halloween Candy (DoorDash)",
            items: [
                { answer: "REESE'S PEANUT BUTTER CUPS" },
                { answer: "HERSHEY'S MILK CHOCOLATE BAR" },
                { answer: "M&M'S" },
                { answer: "SNICKERS" },
                { answer: "NERDS" },
                { answer: "SKITTLES" },
                { answer: "AIRHEADS" },
                { answer: "SOUR PATCH KIDS" },
                { answer: "HARIBO" },
                { answer: "KIT KAT" }
            ]
        };

                const WORD_BANK = [
            "REESE'S PEANUT BUTTER CUPS", "PEZ", "HERSHEY'S MILK CHOCOLATE", 
            "M&M'S", "SNICKERS", "KIT KAT", "SOUR PATCH KIDS", "HARIBO GOLDBEARS", 
            "SKITTLES", "TWIX", "STARBURST", "MILKY WAY", "3 MUSKETEERS", "BUTTERFINGER", 
            "NERDS", "TWIZZLERS", "SWEDISH FISH", "AIRHEADS", "JOLLY RANCHERS", 
            "YORK PEPPERMINT PATTY", "ALMOND JOY", "MOUNDS", "BABY RUTH", "PAYDAY", "WHOPPERS",
            "REESE'S PIECES", "CRUNCH BAR", "ROLO", "HEATH", "TOBLERONE", "KINDER BUENO",
            "PEEPS", "NERDS GUMMY CLUSTERS", "GUSHERS", "FRUIT BY THE FOOT", "RING POP",
            "SWEETTARTS", "FUN DIP", "GOOBERS", "RAISINETS", "PIXIE STICKS", "BLOW POPS",
            "DUM DUMS", "JELLY BEANS", "MR GOODBAR", "GOBSTOPPERS", "WHATCHAMACALLIT", "LIFESAVERS", "100 GRAND",
            "MIKE AND IKE", "POP ROCKS", "MILK DUDS", "SMARTIES", "PEACH RINGS", "TOOTSIE ROLL"
        ];

        let guessedIndices = new Set();
        let incorrectGuesses = 0;
        const MAX_LIVES = 5;
        let revealed = false;
        let attemptedWrongWords = new Set(); // Tracks incorrect guesses for word bank coloring

        const guessForm = document.getElementById('guessForm');
        const guessInput = document.getElementById('guessInput');
        const autocompleteList = document.getElementById('autocomplete-list');
        const slotsContainer = document.getElementById('slots-container');
        const foundCountEl = document.getElementById('found-count');
        const livesContainer = document.getElementById('lives-container');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        const wordBankToggle = document.getElementById('wordBankToggle');
        const wordBankDrawer = document.getElementById('wordBankDrawer');
        const wordBankList = document.getElementById('word-bank-list');
        const revealBtn = document.getElementById('revealBtn');
        const resetBtn = document.getElementById('resetBtn');
        const gameOverModal = document.getElementById('gameOverModal');
        const tryAgainBtn = document.getElementById('tryAgainBtn');

        function normalize(str) {
            return str.toUpperCase().replace(/[^A-Z0-9]/g, '');
        }

        function initGame() {
            renderSlots();
            renderWordBank();
            renderLives();
            loadProgress();
        }

        function renderLives() {
            livesContainer.innerHTML = '';
            const livesLeft = Math.max(0, MAX_LIVES - incorrectGuesses);
            for (let i = 0; i < MAX_LIVES; i++) {
                const heart = document.createElement('span');
                if (i < livesLeft) {
                    heart.className = 'text-terracotta text-base';
                    heart.textContent = '❤️';
                } else {
                    heart.className = 'text-gray-300 text-base';
                    heart.textContent = '🤍';
                }
                livesContainer.appendChild(heart);
            }
        }

        function renderSlots(justGuessedIdx = null) {
            slotsContainer.innerHTML = '';
            PUZZLE.items.forEach((item, idx) => {
                const isGuessed = guessedIndices.has(idx) || revealed;
                const slot = document.createElement('div');
                let baseClass = `slot-item p-3.5 rounded-2xl border flex items-center justify-between transition-all ${isGuessed ? 'bg-white border-fall-sand shadow-sm' : 'bg-white/50 border-dashed border-fall-sand'}`;
                if (idx === justGuessedIdx) {
                    baseClass += ' animate-success ring-2 ring-terracotta';
                }
                slot.className = baseClass;
                
                if (isGuessed) {
                    slot.innerHTML = `
                        <div class="flex items-center gap-3">
                            <span class="w-6 h-6 rounded-full bg-terracotta text-white flex items-center justify-center text-xs font-bold flex-shrink-0">${idx + 1}</span>
                            <span class="font-serif font-bold text-fall-charcoal text-sm sm:text-base tracking-wide">${item.answer}</span>
                        </div>
                    `;
                } else {
                    slot.innerHTML = `
                        <div class="flex items-center gap-3">
                            <span class="w-6 h-6 rounded-full bg-fall-sand text-gray-500 flex items-center justify-center text-xs font-bold flex-shrink-0">${idx + 1}</span>
                            <span class="font-serif text-gray-400 text-sm tracking-widest">••••••••••</span>
                        </div>
                    `;
                }
                slotsContainer.appendChild(slot);
            });
            foundCountEl.textContent = guessedIndices.size;
        }

        function renderWordBank() {
            wordBankList.innerHTML = '';
            const sortedWords = [...WORD_BANK].sort(() => Math.random() - 0.5);

            sortedWords.forEach(word => {
                const chip = document.createElement('button');
                chip.type = 'button';
                
                const normWord = normalize(word);
                let isCorrectlyGuessed = false;
                PUZZLE.items.forEach((item, idx) => {
                    if (normalize(item.answer) === normWord && (guessedIndices.has(idx) || revealed)) {
                        isCorrectlyGuessed = true;
                    }
                });

                const isWronglyGuessed = attemptedWrongWords.has(normWord);

                let chipClass = 'px-3 py-1.5 rounded-full border text-xs font-bold transition-colors ';
                if (isCorrectlyGuessed) {
                    chipClass += 'bg-green-100 text-green-700 border-green-300 cursor-default opacity-80';
                } else if (isWronglyGuessed) {
                    chipClass += 'bg-red-50 text-red-400 border-red-200 cursor-default line-through opacity-60';
                } else {
                    chipClass += 'bg-fall-cream text-fall-charcoal border-fall-sand hover:bg-terracotta hover:text-white cursor-pointer';
                }

                chip.className = chipClass;
                chip.textContent = word;

                if (!isCorrectlyGuessed && !isWronglyGuessed) {
                    chip.addEventListener('click', () => {
                        guessInput.value = word;
                        autocompleteList.classList.add('hidden');
                        guessInput.focus();
                    });
                } else {
                    chip.disabled = true;
                }

                wordBankList.appendChild(chip);
            });
        }

        wordBankToggle.addEventListener('click', () => {
            wordBankDrawer.classList.toggle('hidden');
            wordBankToggle.textContent = wordBankDrawer.classList.contains('hidden') ? '📁 Toggle Word Bank' : '📁 Hide Word Bank';
        });

        guessInput.addEventListener('input', () => {
            const val = guessInput.value.trim().toUpperCase();
            autocompleteList.innerHTML = '';

            if (!val) {
                autocompleteList.classList.add('hidden');
                return;
            }

            const matches = WORD_BANK.filter(word => word.toUpperCase().includes(val));

            if (matches.length > 0) {
                matches.forEach(match => {
                    const item = document.createElement('div');
                    item.className = 'px-4 py-2 hover:bg-fall-cream cursor-pointer text-sm font-serif text-fall-charcoal border-b border-fall-sand last:border-b-0';
                    item.textContent = match;
                    item.addEventListener('mousedown', (e) => {
                        e.preventDefault();
                        guessInput.value = match;
                        autocompleteList.classList.add('hidden');
                    });
                    autocompleteList.appendChild(item);
                });
                autocompleteList.classList.remove('hidden');
            } else {
                autocompleteList.classList.add('hidden');
            }
        });

        guessInput.addEventListener('blur', () => {
            setTimeout(() => {
                autocompleteList.classList.add('hidden');
            }, 200);
        });

        function showToast(msg) {
            toastMessage.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        guessForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const val = guessInput.value.trim();
            if (!val || incorrectGuesses >= MAX_LIVES) return;

            autocompleteList.classList.add('hidden');
            const normVal = normalize(val);
            let foundIdx = -1;

            PUZZLE.items.forEach((item, idx) => {
                if (normalize(item.answer) === normVal && !guessedIndices.has(idx)) {
                    foundIdx = idx;
                }
            });

            if (foundIdx !== -1) {
                guessedIndices.add(foundIdx);
                showToast(`Found: ${PUZZLE.items[foundIdx].answer}! 🎉`);
                guessInput.value = '';
                renderSlots(foundIdx);
                renderWordBank();
                saveProgress();

                if (guessedIndices.size === PUZZLE.items.length) {
                    showToast("Amazing! You found all 10! 🏆", 4000);
                }
            } else {
                let alreadyGuessed = false;
                PUZZLE.items.forEach((item, idx) => {
                    if (normalize(item.answer) === normVal && guessedIndices.has(idx)) {
                        alreadyGuessed = true;
                    }
                });

                if (alreadyGuessed) {
                    showToast("Already guessed!");
                } else {
                    attemptedWrongWords.add(normVal);
                    incorrectGuesses++;
                    console.log('Incorrect guess! Lives now:', MAX_LIVES - incorrectGuesses);
                    renderLives();
                    renderWordBank();
                    saveProgress();
                    showToast(`Incorrect! (-1 Life) ❌`);

                    if (incorrectGuesses >= MAX_LIVES) {
                        gameOverModal.classList.remove('hidden');
                    }
                }
                guessInput.value = '';
            }
        });

        revealBtn.addEventListener('click', () => {
            revealed = true;
            renderSlots();
            renderWordBank();
            showToast("Puzzle revealed!");
        });

        resetBtn.addEventListener('click', fullReset);
        tryAgainBtn.addEventListener('click', () => {
            gameOverModal.classList.add('hidden');
            fullReset();
        });

        function fullReset() {
            guessedIndices.clear();
            attemptedWrongWords.clear();
            incorrectGuesses = 0;
            revealed = false;
            renderSlots();
            renderWordBank();
            renderLives();
            localStorage.removeItem('ryan_erica_dailytens_progress');
            localStorage.removeItem('ryan_erica_dailytens_lives');
            localStorage.removeItem('ryan_erica_dailytens_wrong');
            showToast("Game reset!");
        }

        function saveProgress() {
            localStorage.setItem('ryan_erica_dailytens_progress', JSON.stringify([...guessedIndices]));
            localStorage.setItem('ryan_erica_dailytens_lives', incorrectGuesses.toString());
            localStorage.setItem('ryan_erica_dailytens_wrong', JSON.stringify([...attemptedWrongWords]));
        }

        function loadProgress() {
            const savedProg = localStorage.getItem('ryan_erica_dailytens_progress');
            const savedLives = localStorage.getItem('ryan_erica_dailytens_lives');
            const savedWrong = localStorage.getItem('ryan_erica_dailytens_wrong');
            if (savedProg) {
                try {
                    guessedIndices = new Set(JSON.parse(savedProg));
                } catch(e) {}
            }
            if (savedLives) {
                incorrectGuesses = parseInt(savedLives) || 0;
                if (incorrectGuesses >= MAX_LIVES) {
                    gameOverModal.classList.remove('hidden');
                }
            }
            if (savedWrong) {
                try {
                    attemptedWrongWords = new Set(JSON.parse(savedWrong));
                } catch(e) {}
            }
            renderSlots();
            renderWordBank();
            renderLives();
        }

        initGame();
    </script>
</body>
</html>
